name: trusttrace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trusttrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trusttrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trusttrace -d trusttrace']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
    image: trusttrace-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgres://trusttrace_app:${APP_DB_PASSWORD}@postgres:5432/trusttrace
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 7
      WS_TICKET_SECRET: ${WS_TICKET_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      CHAOS_FAIL_TOKEN: __fail__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      MEMORY_MAX_TRACES: 20000

  frontend:
    build:
      context: ../../trusttrace-frontend
      args:
        API_BASE_URL: http://backend:4000/api/v1
        NEXT_PUBLIC_WS_URL: https://${DOMAIN}/chat
    image: trusttrace-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:4000/api/v1
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../jaeger-auth.caddy:/etc/caddy/jaeger-auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - jaeger

  tools:
    image: trusttrace-backend
    profiles: ['tools']
    environment:
      DATABASE_URL: postgres://trusttrace:${POSTGRES_PASSWORD}@postgres:5432/trusttrace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
